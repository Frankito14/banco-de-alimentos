services:
  # DB
  db:
    image: postgres:16-alpine
    container_name: tp_banco_alimentos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Cache
  redis:
    image: redis:7-alpine
    container_name: tp_banco_alimentos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Cola de mensajería
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tp_banco_alimentos_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # panel de administración
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # BE
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tp_banco_alimentos_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      PADRON_PROVINCIAL_URL: http://host.docker.internal:6767
      RENDICION_CUENTAS_URL: http://host.docker.internal:7777
    ports:
      - "${PORT_BACKEND}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  # FE
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tp_banco_alimentos_frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND}:80"
    environment:
      VITE_API_URL: http://localhost:${PORT_BACKEND}
    depends_on:
      - backend
    networks:
      - backend

  # Doc
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.11.0
    container_name: tp_banco_alimentos_swagger
    restart: unless-stopped
    ports:
      - "${PORT_SWAGGER}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./backend/open-api.yaml:/spec/openapi.yaml:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data: